<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">

<title>Hoop – Basketball AI test</title>

<style>
:root{
  --bg:#071018;
  --panel:#111c27;
  --text:#f8fafc;
  --muted:#94a3b8;
  --green:#22c55e;
  --blue:#38bdf8;
  --yellow:#facc15;
  --orange:#ff7a00;
  --red:#ef4444;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  width:min(900px,100%);
  margin:auto;
  padding:14px;
}

h1{
  margin:0 0 4px;
  font-size:30px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:14px;
}

.card{
  background:var(--panel);
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  overflow:hidden;
}

.stage{
  position:relative;
  background:#000;
}

.stage.mirrored video,
.stage.mirrored #overlay{
  transform:scaleX(-1);
}

video{
  width:100%;
  display:block;
  background:#000;
  max-height:70vh;
}

canvas#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.controls{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

button{
  min-height:52px;
  border:0;
  border-radius:13px;
  background:#1d2d3b;
  color:white;
  font-size:16px;
  font-weight:800;
  padding:10px;
}

button.primary{
  background:var(--orange);
  color:#111;
}

button.green{
  background:#166534;
}

button.blue{
  background:#075985;
}

button.red{
  background:#991b1b;
}

button:disabled{
  opacity:.4;
}

.status{
  margin-top:12px;
  background:#0b151f;
  border-radius:14px;
  padding:12px;
}

.statusrow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:4px 0;
}

.statusrow span{
  color:var(--muted);
}

#message{
  margin-top:12px;
  padding:12px;
  min-height:48px;
  border-radius:12px;
  background:#0b151f;
  line-height:1.4;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}

.legend b:nth-child(1){color:var(--green)}
.legend b:nth-child(2){color:var(--blue)}
.legend b:nth-child(3){color:var(--yellow)}

.progress{
  height:8px;
  margin-top:8px;
  border-radius:99px;
  overflow:hidden;
  background:#263746;
}

#progressBar{
  width:0%;
  height:100%;
  background:var(--green);
  transition:width .15s;
}

@media(max-width:600px){
  h1{font-size:25px}
  .two{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<h1>🏀 Hoop AI Test</h1>

<div class="subtitle">
Deze pagina test alleen of de nieuwe AI de echte basketbal kan herkennen.
</div>

<div class="card">

  <div class="stage" id="stage">

    <video
      id="video"
      muted
      playsinline
      controls>
    </video>

    <canvas id="overlay"></canvas>

  </div>

</div>

<div class="controls">

  <button
    id="loadAI"
    class="primary">
    1. Laad basketbal-AI
  </button>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div class="two">

    <button
      id="frontCamera"
      class="blue"
      disabled>
      🤳 Voorcamera
    </button>

    <button
      id="rearCamera"
      class="blue"
      disabled>
      📷 Achtercamera
    </button>

  </div>

  <button
    id="videoButton"
    disabled>
    🎬 Testvideo kiezen
  </button>

  <input
    id="fileInput"
    type="file"
    accept="video/*"
    hidden>

  <button
    id="startButton"
    class="green"
    disabled>
    ▶ Start detectie
  </button>

  <button
    id="stopButton"
    class="red"
    disabled>
    ■ Stop detectie
  </button>

</div>

<div id="message">
Druk eerst op <strong>Laad basketbal-AI</strong>.
</div>

<div class="status">

  <div class="statusrow">
    <span>AI</span>
    <strong id="aiStatus">niet geladen</strong>
  </div>

  <div class="statusrow">
    <span>Laatste analyse</span>
    <strong id="speedStatus">—</strong>
  </div>

  <div class="statusrow">
    <span>Basketbal</span>
    <strong id="ballStatus">—</strong>
  </div>

  <div class="statusrow">
    <span>Score AI</span>
    <strong id="confidenceStatus">—</strong>
  </div>

</div>

<div class="legend">
  <b>■ groen = Basketball</b>
  <b>■ blauw = Person</b>
  <b>■ geel = Other Balls</b>
</div>

</div>

<canvas
  id="frameCanvas"
  width="640"
  height="360"
  hidden>
</canvas>


<script type="module">

import {
  pipeline,
  env,
  RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const stage =
  document.getElementById("stage");

const overlay =
  document.getElementById("overlay");

const ctx =
  overlay.getContext("2d");

const frameCanvas =
  document.getElementById("frameCanvas");

const frameCtx =
  frameCanvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

const loadAIButton =
  document.getElementById("loadAI");

const frontCameraButton =
  document.getElementById("frontCamera");

const rearCameraButton =
  document.getElementById("rearCamera");

const videoButton =
  document.getElementById("videoButton");

const fileInput =
  document.getElementById("fileInput");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const message =
  document.getElementById("message");

const aiStatus =
  document.getElementById("aiStatus");

const speedStatus =
  document.getElementById("speedStatus");

const ballStatus =
  document.getElementById("ballStatus");

const confidenceStatus =
  document.getElementById("confidenceStatus");

const progressBar =
  document.getElementById("progressBar");


/* =====================================================
   STATE
===================================================== */

let detector = null;

let stream = null;

let detectionRunning = false;

let inferenceBusy = false;

let mirrored = false;

let currentObjectURL = null;


/* =====================================================
   TRANSFORMERS SETTINGS
===================================================== */

env.allowLocalModels = false;


/* =====================================================
   HELPERS
===================================================== */

function setMessage(text){
  message.innerHTML = text;
}


function enableSourceButtons(){

  frontCameraButton.disabled = false;
  rearCameraButton.disabled = false;
  videoButton.disabled = false;

}


function prepareOverlay(){

  overlay.width =
    video.videoWidth;

  overlay.height =
    video.videoHeight;

}


function clearOverlay(){

  ctx.clearRect(
    0,
    0,
    overlay.width,
    overlay.height
  );

}


function stopCurrentSource(){

  detectionRunning = false;

  if(stream){

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;

  }

  if(currentObjectURL){

    URL.revokeObjectURL(
      currentObjectURL
    );

    currentObjectURL = null;

  }

  video.pause();

  video.srcObject = null;

  video.removeAttribute("src");

  clearOverlay();

}


function waitForVideo(){

  return new Promise(resolve => {

    if(
      video.videoWidth &&
      video.videoHeight
    ){
      resolve();
      return;
    }

    video.addEventListener(
      "loadedmetadata",
      () => resolve(),
      {once:true}
    );

  });

}


/* =====================================================
   LOAD AI
===================================================== */

loadAIButton.addEventListener(
  "click",
  async () => {

    loadAIButton.disabled = true;

    aiStatus.textContent =
      "laden…";

    setMessage(
      "Het nieuwe AI-model wordt geladen. " +
      "De eerste keer kan dit even duren. Laat deze pagina openstaan."
    );


    try{

      detector =
        await pipeline(
          "object-detection",

          "onnx-community/dfine_s_obj365-ONNX",

          {
            progress_callback: progress => {

              if(
                typeof progress.progress === "number"
              ){

                progressBar.style.width =
                  Math.round(
                    progress.progress
                  ) + "%";

              }

            }
          }
        );


      progressBar.style.width =
        "100%";


      aiStatus.textContent =
        "✓ klaar";


      enableSourceButtons();


      setMessage(
        "<strong>AI klaar.</strong> " +
        "Kies nu bij voorkeur eerst jouw testvideo."
      );

    }

    catch(error){

      console.error(error);


      aiStatus.textContent =
        "fout";


      loadAIButton.disabled = false;


      setMessage(
        "<strong>AI kon niet laden.</strong><br>" +
        error.message
      );

    }

  }
);


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(facing){

  stopCurrentSource();


  try{

    mirrored =
      facing === "user";


    stage.classList.toggle(
      "mirrored",
      mirrored
    );


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:facing
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:30,
              max:60
            }

          }

        });


    video.controls = false;

    video.srcObject =
      stream;


    await video.play();

    await waitForVideo();


    prepareOverlay();


    startButton.disabled = false;


    setMessage(
      "Camera actief. Zorg dat persoon en bal duidelijk zichtbaar zijn en druk op <strong>Start detectie</strong>."
    );

  }

  catch(error){

    console.error(error);


    setMessage(
      "<strong>Camera kon niet starten.</strong><br>" +
      error.message
    );

  }

}


frontCameraButton.addEventListener(
  "click",
  () => startCamera("user")
);


rearCameraButton.addEventListener(
  "click",
  () => startCamera("environment")
);


/* =====================================================
   VIDEO FILE
===================================================== */

videoButton.addEventListener(
  "click",
  () => fileInput.click()
);


fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    stopCurrentSource();


    mirrored = false;

    stage.classList.remove(
      "mirrored"
    );


    currentObjectURL =
      URL.createObjectURL(file);


    video.controls = true;

    video.src =
      currentObjectURL;


    video.muted = true;

    video.playsInline = true;


    await waitForVideo();


    prepareOverlay();


    video.currentTime = 0;


    startButton.disabled = false;


    setMessage(
      "Video geladen. Druk op <strong>Start detectie</strong>. " +
      "De video blijft op normale snelheid lopen."
    );

  }
);


/* =====================================================
   FRAME PREPARATION
===================================================== */

function copyCurrentFrame(){

  const sourceWidth =
    video.videoWidth;

  const sourceHeight =
    video.videoHeight;


  /*
    We geven de AI maximaal 640 pixels breed.

    Dit vermindert rekenwerk op een telefoon
    zonder het beeld extreem klein te maken.
  */

  const width =
    Math.min(
      640,
      sourceWidth
    );


  const height =
    Math.round(
      width *
      sourceHeight /
      sourceWidth
    );


  frameCanvas.width =
    width;


  frameCanvas.height =
    height;


  frameCtx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  return {
    width,
    height
  };

}


/* =====================================================
   DRAW DETECTIONS
===================================================== */

function drawDetection(
  detection,
  frameWidth,
  frameHeight
){

  const label =
    String(
      detection.label || ""
    );


  const normalizedLabel =
    label.toLowerCase();


  let color = null;


  if(
    normalizedLabel === "basketball"
  ){

    color =
      "#22c55e";

  }

  else if(
    normalizedLabel === "person"
  ){

    color =
      "#38bdf8";

  }

  else if(
    normalizedLabel === "other balls"
  ){

    color =
      "#facc15";

  }

  else{

    return;

  }


  const box =
    detection.box;


  const scaleX =
    overlay.width /
    frameWidth;


  const scaleY =
    overlay.height /
    frameHeight;


  const x =
    box.xmin *
    scaleX;


  const y =
    box.ymin *
    scaleY;


  const width =
    (
      box.xmax -
      box.xmin
    ) *
    scaleX;


  const height =
    (
      box.ymax -
      box.ymin
    ) *
    scaleY;


  ctx.strokeStyle =
    color;


  ctx.lineWidth =
    normalizedLabel === "basketball"
    ? 6
    : 3;


  ctx.strokeRect(
    x,
    y,
    width,
    height
  );


  const percentage =
    Math.round(
      detection.score * 100
    );


  const text =
    label.toUpperCase() +
    " " +
    percentage +
    "%";


  ctx.font =
    "bold 18px Arial";


  const textWidth =
    ctx.measureText(text).width;


  ctx.fillStyle =
    color;


  ctx.fillRect(
    x,
    Math.max(0,y-27),
    textWidth+12,
    27
  );


  ctx.fillStyle =
    "#071018";


  ctx.fillText(
    text,
    x+6,
    Math.max(19,y-7)
  );

}


/* =====================================================
   AI LOOP
===================================================== */

async function runDetection(){

  if(
    !detectionRunning ||
    !detector
  ){
    return;
  }


  if(
    inferenceBusy ||
    video.readyState < 2
  ){

    requestAnimationFrame(
      runDetection
    );

    return;
  }


  inferenceBusy = true;


  try{

    const {
      width,
      height
    } =
      copyCurrentFrame();


    const rawImage =
      RawImage.fromCanvas(
        frameCanvas
      );


    const start =
      performance.now();


    /*
      Lage threshold is bewust gekozen.

      Een snel bewegende basketbal
      is klein en onscherp.
    */

    const detections =
      await detector(
        rawImage,
        {
          threshold:0.10
        }
      );


    const elapsed =
      Math.round(
        performance.now() -
        start
      );


    speedStatus.textContent =
      elapsed + " ms";


    clearOverlay();


    const basketballs =
      detections.filter(
        detection =>
          String(
            detection.label
          ).toLowerCase()
          ===
          "basketball"
      );


    const otherBalls =
      detections.filter(
        detection =>
          String(
            detection.label
          ).toLowerCase()
          ===
          "other balls"
      );


    /*
      Alleen relevante objecten tekenen.
    */

    for(
      const detection of detections
    ){

      drawDetection(
        detection,
        width,
        height
      );

    }


    if(
      basketballs.length
    ){

      const best =
        basketballs.sort(
          (a,b) =>
            b.score-a.score
        )[0];


      ballStatus.textContent =
        "✓ GEVONDEN";


      ballStatus.style.color =
        "#86efac";


      confidenceStatus.textContent =
        Math.round(
          best.score*100
        ) + "%";


      setMessage(
        "<strong style='color:#86efac'>🏀 Basketbal gevonden.</strong> " +
        "Kijk of het groene vak ook tijdens de vlucht op de echte bal blijft."
      );

    }

    else if(
      otherBalls.length
    ){

      const best =
        otherBalls.sort(
          (a,b) =>
            b.score-a.score
        )[0];


      ballStatus.textContent =
        "bal gezien, type onzeker";


      ballStatus.style.color =
        "#fde047";


      confidenceStatus.textContent =
        Math.round(
          best.score*100
        ) + "%";


      setMessage(
        "De AI ziet wel een bal, maar noemt hem <strong>Other Balls</strong>. " +
        "Dat is belangrijke testinformatie."
      );

    }

    else{

      ballStatus.textContent =
        "niet gevonden";


      ballStatus.style.color =
        "#fca5a5";


      confidenceStatus.textContent =
        "—";

    }

  }

  catch(error){

    console.error(error);


    setMessage(
      "<strong>Detectiefout:</strong> " +
      error.message
    );

  }

  finally{

    inferenceBusy = false;

  }


  /*
    Niet kunstmatig vertragen.

    Nieuwe analyse start zodra de vorige klaar is.
    Video/camera zelf blijft realtime lopen.
  */

  if(
    detectionRunning
  ){

    setTimeout(
      runDetection,
      10
    );

  }

}


/* =====================================================
   START / STOP
===================================================== */

startButton.addEventListener(
  "click",
  async () => {

    if(
      !detector
    ){
      return;
    }


    detectionRunning = true;


    startButton.disabled =
      true;


    stopButton.disabled =
      false;


    /*
      Video blijft 1×.
    */

    video.playbackRate =
      1;


    try{
      await video.play();
    }catch{}


    setMessage(
      "<strong>AI detectie actief.</strong> " +
      "Groen moet de basketbal volgen."
    );


    runDetection();

  }
);


stopButton.addEventListener(
  "click",
  () => {

    detectionRunning =
      false;


    startButton.disabled =
      false;


    stopButton.disabled =
      true;


    setMessage(
      "Detectie gestopt."
    );

  }
);

</script>

</body>
</html>
